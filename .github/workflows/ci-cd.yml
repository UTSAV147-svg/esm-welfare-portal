name: VeerSeva CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Test & Quality Checks
  test:
    name: Unit Tests & Code Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_key_12345
          DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  # Job 2: Security & Vulnerability Scan (CERT-In Compliance)
  security-scan:
    name: Trivy Security & Dependency Audit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Security Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # Job 3: Docker Build & Registry Push
  build-and-deploy:
    name: Build Multi-Stage Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: veerseva-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment Notification
        run: |
          echo "==========================================================="
          echo "VeerSeva Defense Platform Successfully Built and Validated"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Target Environment: Defense Staging Cluster"
          echo "==========================================================="
