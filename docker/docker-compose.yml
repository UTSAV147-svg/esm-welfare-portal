version: '3.8'

services:
  # Nginx Reverse Proxy / Load Balancer
  nginx:
    image: nginx:1.25-alpine
    container_name: veerseva-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - veerseva-network
    restart: unless-stopped

  # Stateless API Service (Horizontal Scaling Enabled)
  api:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=veerseva_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super_secret_jwt_access_key_defense_portal_2026_xyz!
      - JWT_REFRESH_SECRET=super_secret_jwt_refresh_key_defense_portal_2026_abc!
      - DATA_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    volumes:
      - veerseva_uploads:/usr/src/app/backend/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - veerseva-network
    restart: unless-stopped
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Relational Database: MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: veerseva-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: veerseva_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../backend/src/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - veerseva-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: veerseva-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - veerseva-network
    restart: unless-stopped

networks:
  veerseva-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  veerseva_uploads:
